# The per-task `timeout` below (dev:spec, dev:spec-mt, dev:ameba) is only
# trustworthy from 2026.10.2 on: before 2026.10.1 a timed-out task's processes
# could keep running, and before 2026.10.2 a task that caught SIGTERM and
# exited 0 was reported as a success. An older mise must refuse to run rather
# than silently leave those tasks unbounded.
min_version = "2026.10.2"

[settings]
aqua.registries = ["https://github.com/jbox-web/aqua-registry"]

[tools]
crystal = "1.20.3"
"aqua:elbywan/crystalline" = "0.18.0"

[vars]
# Change APP_NAME per project — everything else derives from it.
APP_NAME    = "watch"
SOURCE_FILE = "src/{{vars.APP_NAME}}.cr"

DEFAULT_COMPILE_OPTS_DEV     = "--threads 4"

SPEC_OPTS            = "{% if exec(command='(tty -s && echo true) || echo false') == 'true' %}--verbose{% endif %}"
COMPILE_OPTS_DEV     = "{% if exec(command='(tty -s && echo true) || echo false') == 'true' %}{{vars.DEFAULT_COMPILE_OPTS_DEV}} --progress{% else %}{{vars.DEFAULT_COMPILE_OPTS_DEV}}{% endif %}"


#####################
# Development tasks #
#####################

# A library has no binary: the build is a compile check of the whole source.
[tasks."dev:build"]
description = "Compile-check the library (no binary; ensures it builds)"
run = "crystal build {{vars.COMPILE_OPTS_DEV}} --no-codegen {{vars.SOURCE_FILE}}"

[tasks."dev:deps"]
description = "Install development dependencies"
run = "shards install"

[tasks."dev:clean"]
description = "Cleanup environment"
run = "rm -rf bin/* lib/"

# Add "dev:build" to the depends when the specs drive the compiled binary rather
# than the library: without it they fail with "no such file or directory" in any
# context that runs dev:spec on its own, which locally never happens because
# dev:check builds first.
# Bounded like dev:ameba, and for the same reason the ameba comment already
# names: a spec run can spin forever. Observed on a real project — the
# multi-threaded binary ran 11 minutes at 100% CPU on a tree whose only change
# was documentation, then passed in 176ms on the next attempt. A livelock of
# that kind fails nowhere: with no bound the CI job holds a runner until the
# platform's own job timeout (6h by default on GitHub) instead of failing in
# minutes with "timed out after 600s". 600s leaves room for a cold compile on a
# slow runner.
[tasks."dev:spec"]
description = "Run Crystal spec"
timeout = "600s"
run = "crystal spec {{vars.SPEC_OPTS}}"

[tasks."dev:spec-mt"]
description = "Run Crystal spec (multi-threaded)"
env = { CRYSTAL_WORKERS = "4" }
timeout = "600s"
run = "crystal spec {{vars.SPEC_OPTS}} -Dpreview_mt"

[tasks."dev:docs"]
description = "Generate project documentation"
run = "rm -rf docs && crystal doc"

# ameba can spin at 100% CPU indefinitely on some inputs, so the task carries its
# own bound: the analysis is killed after 180s and the task fails with "timed
# out after 180s" instead of running for hours unnoticed. Never call `bin/ameba`
# directly. The bound is mise's own task `timeout`, not the coreutils command:
# it works the same on Linux and macOS (which ships no `timeout`), and mise
# kills the whole process tree — SIGTERM, then SIGKILL 5s later.
[tasks."dev:ameba"]
description = "Run static code analysis"
timeout = "180s"
run = "bin/ameba"

[tasks."dev:format"]
description = "Format code"
run = "crystal tool format src/ spec/"

[tasks."dev:format-check"]
description = "Check code formatting without modifying files"
run = "crystal tool format --check src/ spec/"

# TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
[tasks."dev:fix-shards-command"]
description = "Fix missing shards command"
run = "cp $HOME/.local/share/mise/installs/crystal/{{tools.crystal.version}}/embedded/bin/shards $HOME/.local/share/mise/installs/crystal/{{tools.crystal.version}}/bin/"

[tasks."dev:check"]
description = "Build-check, lint and test in one shot"
run = "mise dev:build && mise dev:ameba && mise dev:spec"
